<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0E1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="description" content="Wordflow — fill the missing word. An unlimited English trainer from A1 to C2.">
<title>Wordflow — English gap trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HOME ============ -->
<section class="screen on" id="home">
  <header class="topbar">
    <div class="brandmark">
      <span class="dot"></span>
      <span>WORD<em>FLOW</em></span>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5m7.43-2.53a7.6 7.6 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.68-.97l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.68.97l-2.39-.96a.5.5 0 0 0-.6.22L2.42 8.83a.5.5 0 0 0 .12.62l2.03 1.58a7.6 7.6 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96a7.3 7.3 0 0 0 1.68.97l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7.3 7.3 0 0 0 1.68-.97l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62Z"/></svg>
    </button>
  </header>

  <div class="hero">
    <h1>Fill the line.</h1>
    <p>Six levels, one missing word at a time. Practise as long as you like — nothing to beat, nothing to unlock.</p>
  </div>

  <div class="scroller">
    <div class="level-grid" id="levelList"></div>
  </div>

  <button class="cta" id="quickPlay">Practise</button>
</section>

<!-- ============ GAME ============ -->
<section class="screen" id="game">
  <header class="hud">
    <button class="icon-btn" id="quitBtn" aria-label="Quit run">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="track"><i id="trackFill" style="width:0%"></i></div>
    <div class="qcount" id="qCount">1 / 10</div>
  </header>

  <div class="slate">
    <div class="slate-head">
      <span class="topic-tag" id="catTag">Topic</span>
      <span class="streak" id="streak"></span>
    </div>
    <p class="sentence" id="sentence"></p>
    <p class="feedback" id="feedback"></p>
  </div>

  <div class="hint-zone" id="hintZone"></div>
  <div id="answerZone"></div>
  <button class="cta" id="actionBtn" hidden>Check</button>
</section>

<!-- ============ RESULTS ============ -->
<section class="screen" id="results">
  <div class="result-head">
    <h2 class="result-title" id="resTitle">Run complete</h2>
    <p class="result-sub" id="resSub">B1 · 8 of 10 correct</p>
  </div>

  <div class="grid-stats">
    <div class="stat"><b id="stAcc">0%</b><span>Accuracy</span></div>
    <div class="stat"><b id="stCorrect">0/0</b><span>Correct</span></div>
    <div class="stat"><b id="stStreak">0</b><span>Best run</span></div>
  </div>

  <div class="scroller">
    <span class="section-label" id="reviewLabel">Worth another look</span>
    <div class="review" id="review"></div>
  </div>

  <div class="row">
    <button class="cta ghost" id="homeBtn">Home</button>
    <button class="cta" id="againBtn">Play again</button>
  </div>
</section>

<!-- ============ RUN SETUP — asked every time a level is picked ============ -->
<div class="sheet-wrap" id="setupWrap">
  <div class="scrim" id="setupScrim"></div>
  <div class="sheet" role="dialog" aria-label="Set up this run">
    <div class="grabber"></div>
    <h2 id="setupTitle">Beginner</h2>
    <p class="note" id="setupSub"></p>

    <div class="opt">
      <label id="lblMode">Answer with</label>
      <div class="picker" id="pickMode" role="group" aria-labelledby="lblMode">
        <button data-mode="tap" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="8.5" height="6" rx="2"/><rect x="13" y="4.5" width="8.5" height="6" rx="2"/><rect x="2.5" y="13.5" width="8.5" height="6" rx="2"/><rect x="13" y="13.5" width="8.5" height="6" rx="2"/></g></svg>
          <span>Word tiles</span>
        </button>
        <button data-mode="type" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="1.8" y="5.5" width="20.4" height="13" rx="2.6"/><path d="M5.6 9.2h.01M9 9.2h.01M12.4 9.2h.01M15.8 9.2h.01M19.2 9.2h.01M5.6 12.4h.01M9 12.4h.01M12.4 12.4h.01M15.8 12.4h.01M19.2 12.4h.01M8.2 15.4h7.6"/></g></svg>
          <span>Keyboard</span>
        </button>
      </div>
      <p class="note" id="modeNote"></p>
    </div>

    <div class="opt">
      <label id="lblCount">How many lines in this run?</label>
      <div class="seg" id="segCount" role="group" aria-labelledby="lblCount"></div>
    </div>

    <button class="cta" id="startRunBtn">Start</button>
    <button class="cta ghost" id="cancelSetup">Cancel</button>
  </div>
</div>

<!-- ============ SETTINGS ============ -->
<div class="sheet-wrap" id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Settings">
    <div class="grabber"></div>
    <h2>Settings</h2>

    <div class="opt">
      <div class="toggle-row">
        <span>Sound</span>
        <button class="sw" data-set="sound" role="switch" aria-checked="false" aria-label="Sound"></button>
      </div>
      <div class="toggle-row">
        <span>Vibration</span>
        <button class="sw" data-set="haptics" role="switch" aria-checked="false" aria-label="Vibration"></button>
      </div>
    </div>

    <button class="danger" id="resetBtn">Reset all progress</button>
    <button class="cta" id="closeSheet">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
