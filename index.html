<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#080A12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="description" content="Wordflow — a fast, offline-friendly English gap-fill trainer from A1 to C2.">
<title>Wordflow — English gap trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HOME ============ -->
<section class="screen on" id="home">
  <div class="home-top">
    <div class="rank-badge" id="rankLv">1</div>
    <div class="rank-meta">
      <div class="rank-name" id="rankName">Newcomer</div>
      <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
    </div>
    <div class="coinpill">◈ <span id="coinCount">0</span></div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">⚙</button>
  </div>

  <div class="brand">
    <span class="eyebrow">English gap trainer</span>
    <h1>WORD<em>FLOW</em></h1>
    <p class="tagline">Fill the blank. Hold the streak.</p>
  </div>

  <div class="scroller">
    <div class="level-list" id="levelList"></div>
  </div>

  <button class="cta" id="quickPlay">Continue</button>
</section>

<!-- ============ GAME ============ -->
<section class="screen" id="game">
  <div class="hud">
    <button class="icon-btn" id="quitBtn" aria-label="Quit">✕</button>
    <div class="track"><i id="trackFill" style="width:0%"></i></div>
    <div class="qcount" id="qCount">1/10</div>
    <div class="hearts" id="hearts"></div>
  </div>

  <div class="combo" id="combo">
    <span id="comboX">⚡ x2</span>
    <div class="bar"><i id="comboBar" style="width:0%"></i></div>
  </div>

  <div class="card">
    <span class="eyebrow" id="catTag">Phrasal verb</span>
    <p class="sentence" id="sentence"></p>
    <p class="feedback" id="feedback"></p>
  </div>

  <div class="hints" id="hints"></div>
  <div id="answerZone"></div>
  <button class="cta" id="actionBtn">Check</button>
</section>

<!-- ============ RESULTS ============ -->
<section class="screen" id="results">
  <div class="result-head">
    <div class="big-stars" id="bigStars">★★★</div>
    <div class="result-title" id="resTitle">Level clear</div>
    <div class="result-sub" id="resSub">B1 · 8 of 10 correct</div>
  </div>
  <div class="grid-stats">
    <div class="stat"><b id="stAcc">0%</b><span>Accuracy</span></div>
    <div class="stat"><b id="stXp">0</b><span>XP</span></div>
    <div class="stat"><b id="stStreak">0</b><span>Best run</span></div>
  </div>
  <div class="scroller">
    <span class="eyebrow" id="reviewLabel">Worth another look</span>
    <div class="review" id="review" style="margin-top:10px"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="cta ghost" id="homeBtn">Home</button>
    <button class="cta" id="againBtn">Play again</button>
  </div>
</section>

<!-- ============ SETTINGS ============ -->
<div class="sheet-wrap" id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet">
    <h2>Settings</h2>
    <div class="opt">
      <label>Questions per run</label>
      <div class="seg" id="segCount"></div>
    </div>
    <div class="opt">
      <label>Answer with</label>
      <div class="seg" id="segMode">
        <button data-mode="tap">Word tiles</button>
        <button data-mode="type">Keyboard</button>
      </div>
    </div>
    <div class="opt">
      <div class="toggle-row"><span>Timer (15s per gap)</span><div class="sw" data-set="timed"></div></div>
      <div class="toggle-row"><span>Sound</span><div class="sw" data-set="sound"></div></div>
      <div class="toggle-row"><span>Vibration</span><div class="sw" data-set="haptics"></div></div>
    </div>
    <button class="danger" id="resetBtn">Reset all progress</button>
    <button class="cta" id="closeSheet" style="margin-top:18px">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
